services:

  mysql:
    image: mysql:8.4
    container_name: neoparking_mysql
    restart: unless-stopped
    # Chaves sem valor: o compose copia cada segredo do shell ou do .env local (ver .env.example).
    environment:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_USER=neoparking_app
      - MYSQL_PASSWORD
    # A porta 3306 não é publicada. Para acessá-la do host, use docker-compose.expose-db.yml.
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/mysql/app-grants.sql:/docker-entrypoint-initdb.d/02-app-grants.sql:ro
    healthcheck:
      # Por TCP: o servidor temporário da inicialização só escuta no socket local.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neoparking_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # A API aplica MYSQL_PASSWORD às connection strings no boot e falha se ele faltar.
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_PASSWORD
      - Jwt__Secret
      - Jwt__Issuer=neoparking
      - Jwt__Audience=neoparking
      - Jwt__ExpireMinutes=60
      - Access__DatabaseProvider=MySQL
      - Access__ConnectionString=Server=mysql;Database=neoparking_access;Uid=neoparking_app;AllowPublicKeyRetrieval=true;SslMode=none;
      - Management__ConnectionString=Server=mysql;Database=neoparking_management;Uid=neoparking_app;AllowPublicKeyRetrieval=true;SslMode=none;
      - Billing__ConnectionString=Server=mysql;Database=neoparking_billing;Uid=neoparking_app;AllowPublicKeyRetrieval=true;SslMode=none;
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  mysql_data:
