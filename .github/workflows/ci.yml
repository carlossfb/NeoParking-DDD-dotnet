name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        id: build
        run: dotnet build Neoparking.sln --configuration Release

      - name: Unit tests
        run: dotnet test Neoparking.sln --configuration Release --no-build --filter "Category!=Integration&Category!=Architecture"

      - name: Architecture tests
        if: ${{ !cancelled() && steps.build.outcome != 'failure' }}
        run: dotnet test Neoparking.sln --configuration Release --no-build --filter "Category=Architecture"

      # O runner já traz Docker, usado pelo Testcontainers. Inclui os testes E2E.
      - name: Integration tests
        if: ${{ !cancelled() && steps.build.outcome != 'failure' }}
        run: dotnet test Neoparking.sln --configuration Release --no-build --filter "Category=Integration"
